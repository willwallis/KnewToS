<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us Test</title>
</head>

<body>
    <form id="contact-form">
        <input type="text" name="name" placeholder="Your Name" required value="Sarah" />
        <input type="email" name="email_address" placeholder="Your Email" required value="Sarah@example.com" />
        <input type="text" name="title" placeholder="Your Title" required value="Sr Direcor" />
        <input type="text" name="company" placeholder="Your Company" required value="SD Consulting" />
        <textarea name="message" placeholder="Your Message" required>"I would be interested in learning more"</textarea>

        <input type="hidden" name="form_token" value="KT93455656_TWOE" />

        <div class="cf-turnstile" data-sitekey="0x4AAAAAABcc5abDdAFZBGcx"></div>

        <button type="submit">Submit</button>
    </form>

    <!-- Display response here -->
    <div id="form-response" style="margin-top: 1rem; font-weight: bold;"></div>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <script>
        const form = document.getElementById("contact-form");
        const responseBox = document.getElementById("form-response");

        form.addEventListener("submit", async (e) => {
            e.preventDefault(); // prevent default form submission

            const formData = new FormData(form);

            // Required: turnstile must finish first
            const turnstileToken = formData.get("cf-turnstile-response");
            if (!turnstileToken) {
                responseBox.textContent = "Please complete the Turnstile challenge.";
                return;
            }

            try {
                const res = await fetch("https://your-worker.example.workers.dev", {
                    method: "POST",
                    body: formData
                });

                const text = await res.text();

                if (res.ok) {
                    responseBox.textContent = text;
                    form.reset();
                    turnstile.reset();
                } else {
                    console.error("Worker Error:", res.status, text);
                    responseBox.textContent = `Error ${res.status}: ${text}`;
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                responseBox.textContent = "Network error. Please try again.";
            }
        });
    </script>
</body>
